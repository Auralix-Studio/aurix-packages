# Compila desde las fuentes el sistema base (bootstrap) de la terminal nativa de Aurix,
# con el nombre de app pro.auralix.aurix, y lo publica como «release» con sus SHA-256.
# La app lo empaqueta dentro del APK (como hace Termux en Google Play).
name: Aurix bootstrap

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: "Arquitecturas separadas por espacios (aarch64 arm x86_64)"
        required: true
        default: "aarch64 arm x86_64"
      add:
        description: "Paquetes extra dentro del sistema base, separados por comas (van en el APK, no se descargan)"
        required: false
        default: "git,openssh"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      archs: ${{ steps.set.outputs.archs }}
    steps:
      - id: set
        env:
          ARCHS: ${{ github.event.inputs.architectures }}
        run: echo "archs=$(echo "$ARCHS" | jq -R -c 'split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: github.repository == 'Auralix-Studio/aurix-packages'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.matrix.outputs.archs) }}
    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - name: Clonar
        uses: actions/checkout@v7
      - name: Compilar el sistema base (${{ matrix.arch }})
        env:
          ADD: ${{ github.event.inputs.add }}
        run: |
          extra=()
          if [ -n "$ADD" ]; then extra=(--add "$ADD"); fi
          # Las descargas de fuentes (Codeberg, Samba...) fallan a veces desde GitHub Actions.
          # El contenedor sigue vivo entre intentos, así que el siguiente continúa con lo ya compilado.
          for attempt in 1 2 3; do
            echo "::group::Intento $attempt de 3"
            if ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures ${{ matrix.arch }} "${extra[@]}" && [ -s "output/bootstrap-${{ matrix.arch }}.zip" ]; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" = 3 ]; then echo "Fallaron los 3 intentos"; exit 1; fi
            echo "Intento $attempt fallido; reintentando en 60 s"
            sleep 60
          done
          # El contenedor solo puede escribir en output/ (AppArmor); el zip queda ahí.
          test -s "output/bootstrap-${{ matrix.arch }}.zip"
          ls -lh "output/bootstrap-${{ matrix.arch }}.zip"
      - name: Guardar
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-${{ matrix.arch }}
          path: output/bootstrap-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Descargar
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          ADD: ${{ github.event.inputs.add }}
        run: |
          cd out
          sha256sum bootstrap-*.zip > SHA256SUMS
          cat SHA256SUMS
          tag="bootstrap-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          # El token del flujo no puede etiquetar un commit anterior si main cambió algún flujo desde entonces (HTTP 403
          # tras horas compilando). En ese caso la etiqueta queda en main y las notas dicen qué commit se compiló.
          target=()
          where="La etiqueta apunta a ese commit."
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA" ]; then
            target=(--target "$GITHUB_SHA")
          else
            where="main avanzó mientras compilaba: la etiqueta NO apunta a ese commit; el código compilado es el de $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" "${target[@]}" \
            --title "Sistema base de la terminal de Aurix ($tag)" \
            --notes "Compilado desde las fuentes de este repositorio (commit $GITHUB_SHA) para pro.auralix.aurix. $where Paquetes extra: ${ADD:-ninguno}. Licencias: ver LICENSE.md y la licencia de cada paquete." \
            ./bootstrap-*.zip SHA256SUMS
